version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
      POSTGRES_DB: pocdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - POC_DATABASE_URL=postgresql://pocuser:pocpass@postgres:5432/pocdb
      - POC_REDIS_URL=redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "backend/worker/worker_runner.py", "--worker-id", "level_ai", "--role", "level_design", "--concurrency", "1", "--tier", "synthesis"]
    environment:
      - POC_API_URL=http://api:8000
      - POC_REDIS_URL=redis://redis:6379/0
      - WORKER_METRICS_PORT=9125
    ports:
      - '9125:9125'
    depends_on:
      - api
      - redis

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:9.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    ports:
      - '9093:9093'
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:
