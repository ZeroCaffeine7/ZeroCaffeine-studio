<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroCaffeine Studio Demo</title>
    <style>
      :root { --bg:#0b1020; --panel:#161d2f; --text:#eaf1ff; --muted:#9fb3d9; --accent:#5cc8ff; }
      *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020 0%,#11182c 100%);color:var(--text)}
      .container{max-width:1200px;margin:40px auto;padding:20px}
      .topbar{display:flex;justify-content:space-between;align-items:center;background:rgba(22,29,47,.9);border:1px solid #2d3a5a;padding:16px 20px;border-radius:12px;margin-bottom:20px}
      .brand{font-size:1.5rem;font-weight:700}
      .controls{display:flex;gap:8px}
      .btn{background:#22304a;border:1px solid #2d3a5a;padding:8px 12px;border-radius:8px;color:var(--text);cursor:pointer}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
      .panel{background:rgba(29,38,64,.95);border:1px solid #2d3a5a;border-radius:12px;padding:18px;min-height:180px}
      .task-list{display:flex;flex-direction:column;gap:8px}
      .task{background:rgba(255,255,255,.02);padding:10px;border-radius:8px}
      .summary pre{white-space:pre-wrap;background:rgba(255,255,255,.02);padding:12px;border-radius:8px;border:1px solid #2d3a5a}
      .log{margin-top:12px;background:#071022;padding:8px;border-radius:8px;height:120px;overflow:auto;border:1px solid #122037}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">ZeroCaffeine Studio PoC</div>
        <div class="controls">
          <button class="btn" id="btn-create-project">创建示例项目</button>
          <button class="btn" id="btn-create-tasks">批量生成任务</button>
          <button class="btn" id="btn-register-workers">注册 Workers</button>
          <button class="btn" id="btn-dispatch">Dispatch</button>
          <button class="btn" id="btn-merge">Merge</button>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h3>Project</h3>
          <div id="project-info">无当前项目</div>
        </div>
        <div class="panel">
          <h3>Tasks</h3>
          <div id="tasks" class="task-list">暂无任务</div>
        </div>
        <div class="panel">
          <h3>Dispatcher</h3>
          <div id="queue">队列信息</div>
        </div>
      </div>

      <div class="panel summary">
        <h3>Merge / Manager Output</h3>
        <pre id="merge-output">尚未合并</pre>
      </div>

      <div class="panel">
        <h3>Activity Log</h3>
        <div id="log" class="log"></div>
      </div>
    </div>

    <script>
      const API = 'http://localhost:8000'
      let currentProjectId = null

      function log(msg){
        const el = document.getElementById('log')
        el.innerText = (new Date()).toISOString() + ' ' + msg + '\n' + el.innerText
      }

      async function createProject(){
        const res = await fetch(API + '/projects', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Mist Dungeon - Level 1',description:'A foggy dungeon'})})
        const data = await res.json()
        currentProjectId = data.id
        document.getElementById('project-info').innerText = JSON.stringify(data, null, 2)
        log('Created project ' + data.id)
        await refreshTasks()
      }

      async function createTasks(){
        if(!currentProjectId){ alert('请先创建项目'); return }
        // generate 12 sample chunk tasks
        for(let i=1;i<=12;i++){
          const title = `chunk-${String(i).padStart(3,'0')} level`
          const body = {project_id: currentProjectId, title, description:`Design chunk ${i}`, role_name:'level_design'}
          await fetch(API + '/tasks', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        }
        log('Created 12 tasks')
        await refreshTasks()
      }

      async function registerWorkers(){
        // register a few level_design workers
        for(let i=1;i<=4;i++){
          const id = `level_worker_${i}`
          await fetch(API + '/workers', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({worker_id:id, role_name:'level_design', capacity:1})})
        }
        log('Registered 4 workers')
        await refreshQueue()
      }

      async function dispatch(){
        // dispatch all new tasks for this project
        const res = await fetch(API + `/tasks/${currentProjectId}`)
        const tasks = await res.json()
        const ids = tasks.filter(t=>t.status==='new').map(t=>t.id)
        if(ids.length===0){ alert('没有 new 状态任务可以 dispatch'); return }
        await fetch(API + '/dispatch', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_ids:ids})})
        log('Dispatched ' + ids.length + ' tasks')
        await refreshTasks(); await refreshQueue()
      }

      async function refreshTasks(){
        if(!currentProjectId) return
        const res = await fetch(API + `/tasks/${currentProjectId}`)
        const tasks = await res.json()
        const container = document.getElementById('tasks')
        container.innerHTML = ''
        for(const t of tasks){
          const el = document.createElement('div'); el.className='task';
          el.innerText = `${t.id} | ${t.title} | ${t.role_name} | ${t.status}`
          container.appendChild(el)
        }
      }

      async function refreshQueue(){
        const res = await fetch(API + '/dispatcher/queue')
        const q = await res.json()
        document.getElementById('queue').innerText = JSON.stringify(q, null, 2)
      }

      async function merge(){
        if(!currentProjectId){ alert('请先创建项目'); return }
        const res = await fetch(API + `/projects/${currentProjectId}/merge`, {method:'POST'})
        const data = await res.json()
        document.getElementById('merge-output').innerText = JSON.stringify(data.merged, null, 2)
        log('Merge completed, repairs: ' + JSON.stringify(data.repairs_created))
        await refreshTasks(); await refreshQueue()
      }

      document.getElementById('btn-create-project').addEventListener('click', createProject)
      document.getElementById('btn-create-tasks').addEventListener('click', createTasks)
      document.getElementById('btn-register-workers').addEventListener('click', registerWorkers)
      document.getElementById('btn-dispatch').addEventListener('click', dispatch)
      document.getElementById('btn-merge').addEventListener('click', merge)

      // initial
      refreshQueue()
    </script>
  </body>
</html>
